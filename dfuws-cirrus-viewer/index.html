<!DOCTYPE HTML>
<html lang="en">
	<head>
		<title>DFUWS Cirrus Viewer</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="icon" href="../images/thumbs/gal_icon2.png" />
		<link rel="stylesheet" href="viewer.css" />
	</head>
	<body>
		<main class="viewer-shell">
			<header class="viewer-header">
				<div>
					<a class="home-link" href="../index.html">Qing Liu</a>
					<h1>DFUWS Cirrus Viewer</h1>
				</div>
				<p>Dragonfly dust-map mosaics compared with Planck radiance</p>
			</header>

			<section class="viewer-stage" aria-label="Interactive dust map comparison">
				<div id="map" class="map"></div>
				<div id="splitter" class="splitter" role="separator" aria-label="Comparison splitter" tabindex="0">
					<span></span>
				</div>
				<div class="map-label left-label">
					<strong id="dragonflyLabel">Dragonfly g</strong>
					<span id="dragonflyUnit">kJy/sr</span>
				</div>
				<div class="map-label right-label">
					<strong>Planck radiance</strong>
					<span id="planckUnit">W/m^2/sr</span>
				</div>
				<div id="scaleBar" class="scale-bar" aria-label="Angular scale bar">
					<span class="scale-line"></span>
					<span id="scaleLabel">Scale</span>
				</div>
				<div id="coordReadout" class="coord-readout" hidden>RA -- Dec --</div>
				<div id="status" class="status" hidden></div>
			</section>

			<aside class="controls" aria-label="Viewer controls">
				<div class="control-group">
					<span class="control-title">Dragonfly band</span>
					<div class="segmented" role="group" aria-label="Dragonfly band selector">
						<button id="mapDragonflyG" class="active" type="button" aria-pressed="true">g</button>
						<button id="mapDragonflyR" type="button" aria-pressed="false">r</button>
					</div>
				</div>

				<div class="control-group">
					<span class="control-title">Colormap</span>
					<div class="segmented segmented-four" role="group" aria-label="Colormap selector">
						<button id="cmapViridis" type="button" aria-pressed="false">viridis</button>
						<button id="cmapInferno" class="active" type="button" aria-pressed="true">inferno</button>
						<button id="cmapAfmhot" type="button" aria-pressed="false">afmhot</button>
						<button id="cmapGray" type="button" aria-pressed="false">gray</button>
					</div>
				</div>

				<div class="control-group">
					<span class="control-title">Display</span>
					<label>Brightness <input id="displayBrightness" type="range" min="40" max="180" value="100" /></label>
					<label>Contrast <input id="displayContrast" type="range" min="40" max="220" value="100" /></label>
				</div>

				<div class="control-group">
					<span class="control-title">View</span>
					<label>Zoom <input id="zoomControl" type="range" min="0.08" max="8" step="0.01" value="1" /></label>
				</div>
			</aside>
		</main>

		<script src="../assets/dfuws_dust_viewer/metadata.js"></script>
		<script src="viewer.js"></script>
	</body>
</html>
